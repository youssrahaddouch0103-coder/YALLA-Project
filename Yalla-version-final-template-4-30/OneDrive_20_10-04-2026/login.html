<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YALLA - Log In</title>
    <meta name="description" content="Log in to your Morocco travel account">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login-split" style="grid-template-columns: 45% 55%;">
  <!-- Colonne gauche : formulaire de login -->
  <div class="login-form-panel anim-slide-right" style="display: flex; justify-content: center; align-items: center;">
    <div class="login-form-inner" style="width: 100%; max-width: 420px; padding: var(--spacing-8);">
      <div class="overline">Welcome Back</div>
      <h2 style="font-size: var(--font-size-5xl); margin-bottom: var(--spacing-2);">Sign In</h2>
      <p class="text-muted" style="margin-bottom: var(--spacing-8);">
        Sign in to access your personalized Morocco travel portal.
      </p>
      <form id="login-form">
        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-8);">
            <label style="display: flex; align-items: center; gap: var(--spacing-2); font-size: var(--font-size-sm); color: var(--color-text-muted); cursor: pointer;">
                <input type="checkbox" id="remember" style="accent-color: var(--color-primary);"> Remember me
            </label>
            <a href="#" style="font-size: var(--font-size-sm); color: var(--color-text-muted); text-decoration: underline;">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Log In</button>
      </form>
      <div style="margin-top: var(--spacing-6); text-align: center;">
          <p style="font-size: var(--font-size-sm); color: var(--color-text-muted);">Don't have an account? <a href="signup.html" style="color: var(--color-primary); font-weight: var(--font-weight-bold);">Sign Up</a></p>
      </div>
    </div>
  </div>

  <!-- Colonne droite : visuel -->
  <div class="login-visual anim-slide-left">
    <div class="login-visual-bg" style="background-image: url('marrakech.png'); background-size: cover; background-position: center;"></div>
    <div class="login-visual-overlay"></div>
    <div class="login-brand">YALLA<span>.</span></div>
    <div class="login-visual-content">
      <blockquote class="login-quote" style="font-size: 2rem;">
        "To travel is to discover that everyone is wrong about other countries."
      </blockquote>
      <div class="anim-fade-up anim-delay-1" style="margin-top: var(--spacing-4);">
        <p style="color: rgba(255,255,255,0.8);">Welcome back to the magic of Morocco.</p>
      </div>
    </div>
    <!-- Vignettes en bas -->
    <div class="login-previews anim-fade-up anim-delay-2">
      <div class="login-preview" style="background-image:url('casablanca.png')"></div>
      <div class="login-preview" style="background-image:url('chefchaouen.png')"></div>
      <div class="login-preview" style="background-image:url('merzouga.png')"></div>
    </div>
  </div>
</main>
<script>
        // Modal functions
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        function showVisaInfo() {
            const val = document.getElementById('visa-country').value;
            const res = document.getElementById('visa-result');
            if (!val) { res.style.display = 'none'; return; }
            res.style.display = 'block';
            if (val === 'visa-free') {
                res.innerHTML = '<strong style="color: #2C3E2D;">✅ Visa-Free Entry (Up to 90 days)</strong>';
            } else {
                res.innerHTML = '<strong style="color: #B45B3E;">⚠️ Visa Required</strong>';
            }
        }

        // Login Script
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('yalla_email');
            const savedPassword = localStorage.getItem('yalla_password');
            if (savedEmail && savedPassword) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').value = savedPassword;
                document.getElementById('remember').checked = true;
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (remember) {
                localStorage.setItem('yalla_email', email);
                localStorage.setItem('yalla_password', password);
            } else {
                localStorage.removeItem('yalla_email');
                localStorage.removeItem('yalla_password');
            }

            const btn = document.getElementById('login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Loading...';
            btn.style.opacity = '0.8';

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                localStorage.setItem('yalla_session', '1');
                localStorage.setItem('yalla_email', email);
                var existingName = localStorage.getItem('yalla_name');
                if (!existingName || !existingName.trim()) {
                    var local = email.split('@')[0] || 'Traveler';
                    var pretty = local.replace(/[._-]+/g, ' ').replace(/\b\w/g, function (c) {
                        return c.toUpperCase();
                    });
                    localStorage.setItem('yalla_name', pretty);
                }
                window.location.href = 'accueil.html';
            }, 1000);
        });
    </script>
<script src="nav-auth.js"></script>
<script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.YallaAuth) {
                YallaAuth.applyStoredPreferences();
                YallaAuth.initNav('nav-auth-container');
            }
        });
    </script>

<script>
// ── Scroll animations ─────────────────────────────────────────────
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('is-visible');
      observer.unobserve(e.target);
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

document.querySelectorAll(
  '.anim-fade-up, .anim-slide-left, .anim-slide-right, .anim-scale-in'
).forEach(el => observer.observe(el));

// ── Navbar scroll shadow ──────────────────────────────────────────
const navbar = document.querySelector('.navbar');
if (navbar) {
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });
}

// ── Smooth number counter (hero stats) ───────────────────────────
document.querySelectorAll('.hero-stat-number').forEach(el => {
  const target = el.textContent;
  if (!isNaN(parseInt(target))) {
    const num = parseInt(target);
    let start = 0;
    const step = num / 40;
    const timer = setInterval(() => {
      start += step;
      if (start >= num) { el.textContent = target; clearInterval(timer); }
      else el.textContent = Math.floor(start);
    }, 30);
  }
});
</script>

</body>

</html>
